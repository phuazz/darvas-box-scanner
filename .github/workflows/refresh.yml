name: Refresh universe data

# Daily after US market close. NYSE closes 21:00 UTC (winter) / 20:00 UTC (DST).
# 22:00 UTC weekdays catches both; data is settled by then.
# Run weekdays only — markets are closed weekends.

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darvas-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch universe
        run: python scripts/fetch_universe.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/universe.json

          # Only commit if the data substantively changed (more than just the
          # as_of_utc timestamp). Compare HEAD's universe.json with current,
          # both with as_of_utc stripped via jq.
          if git cat-file -e HEAD:data/universe.json 2>/dev/null; then
            cur=$(jq -S 'del(.as_of_utc)' data/universe.json)
            prev=$(git show HEAD:data/universe.json | jq -S 'del(.as_of_utc)')
            if [ "$cur" = "$prev" ]; then
              echo "No substantive change — skipping commit."
              exit 0
            fi
          fi

          git commit -m "chore: daily universe refresh $(date -u +%Y-%m-%d)"
          git push
